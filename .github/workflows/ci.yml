name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Pure logic suites — no DB / network needed (deterministic gates only).
      - name: Test — moderation engine
        run: npm run test:moderation

      - name: Test — matching engine
        run: npm run test:matching

      # The app degrades gracefully without secrets (placeholder Supabase creds),
      # so the production build compiles in CI.
      - name: Build
        run: npm run build
